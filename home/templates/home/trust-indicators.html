<!-- Trust Indicators / Stats Section -->
<section class="py-16 lg:py-24 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-12 animate-scroll-reveal">
            <h2 class="text-3xl lg:text-4xl font-bold text-primary mb-4">Our Impact</h2>
            <p class="text-gray-600 text-lg max-w-2xl mx-auto">Trusted by thousands of families, shaping leaders for tomorrow</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Stat Card 1: Years -->
            <div class="stat-card animate-scroll-reveal">
                <div class="flex items-center justify-between mb-4">
                    <div class="stat-number" data-counter-value="25">0</div>
                    <i class="ri-award-fill text-3xl text-secondary opacity-20"></i>
                </div>
                <div class="stat-label">Years of Excellence</div>
            </div>

            <!-- Stat Card 2: Students -->
            <div class="stat-card animate-scroll-reveal">
                <div class="flex items-center justify-between mb-4">
                    <div class="stat-number" data-counter-value="2500">0</div>
                    <i class="ri-group-fill text-3xl text-secondary opacity-20"></i>
                </div>
                <div class="stat-label">Students Served</div>
            </div>

            <!-- Stat Card 3: Faculty -->
            <div class="stat-card animate-scroll-reveal">
                <div class="flex items-center justify-between mb-4">
                    <div class="stat-number" data-counter-value="120">0</div>
                    <i class="ri-user-star-fill text-3xl text-secondary opacity-20"></i>
                </div>
                <div class="stat-label">Dedicated Educators</div>
            </div>

            <!-- Stat Card 4: Recognition -->
            <div class="stat-card animate-scroll-reveal">
                <div class="flex items-center justify-between mb-4">
                    <div class="text-3xl font-bold text-primary">A+</div>
                    <i class="ri-star-fill text-3xl text-secondary opacity-20"></i>
                </div>
                <div class="stat-label">Accreditation Rating</div>
            </div>
        </div>
    </div>
</section>
